name: Deploy to Production

#Spouští se při pushi na main
on:
  push:
    branches:
      - main

#Když přidje druhý push během nasazování předchozího, ten předchozí se zruší
concurrency: 
  group: production_environment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      #Stáhne virtuálně kód na ubuntu virt stroj
      - uses: actions/checkout@v2
      
      #Nastavuje privátní klíč pro ssh připojení k serveru
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace
          
      #Nastavuje cílový server mezi známé hostitele (důvěřuje mu)
      - name: Adding Known Hosts
        run: ssh-keyscan -H bijec.nti.tul.cz >> ~/.ssh/known_hosts
      
      #Deploy přes ssh (jako bych to dělal ručně v cmd)
      - name: Deploy with SSH
        run: |
          ssh soda@bijec.nti.tul.cz "\
            cd /var/www/FVE_WebApplication && \
            git pull && \
            sudo ln -sf /var/www/FVE_WebApplication/nginx/fve.conf /etc/nginx/sites-enabled/fve && \
            sudo rm -f /etc/nginx/sites-enabled/default && \
            sudo nginx -t && \
            sudo systemctl reload nginx && \
            docker-compose down --remove-orphans && \
            docker ps -a | grep 'fve_webapplication' | awk '{print $1}' | xargs -r docker rm -f && \
            docker system prune -af && \
            docker-compose up -d --build && \
            docker-compose exec -T backend python manage.py migrate"